name: Build Windows beta
on:
  push:
    branches: [ main, codex/beta-0.1, 'review/**', 'beta/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/HyperBoost/HyperBoost.csproj
      - name: Build
        run: dotnet build src/HyperBoost/HyperBoost.csproj -c Release --no-restore
      - name: Publish portable EXE
        run: dotnet publish src/HyperBoost/HyperBoost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --no-restore -o publish
      - name: Fetch pinned PresentMon 2.5.1
        shell: pwsh
        run: |
          $url = 'https://github.com/GameTechDev/PresentMon/releases/download/v2.5.1/PresentMon-2.5.1-x64.exe'
          $expected = '9bec3083069f58f911e6a512f4806db51a27bd096103087bc1d05ef54c80a191'
          $target = 'publish\PresentMon-2.5.1-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $target
          $actual = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "PresentMon SHA-256 mismatch. Expected $expected, got $actual"
          }
          Copy-Item 'third_party\PresentMon-LICENSE.txt' 'publish\PRESENTMON-LICENSE.txt' -Force
          Write-Host "PresentMon verified: $actual"
      - name: PresentMon CLI smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'publish\PresentMon-2.5.1-x64.exe').Path
          $output = & $exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host $output
            throw "PresentMon --help exited with code $LASTEXITCODE"
          }
          if ($output -notmatch 'process_id' -or $output -notmatch 'hotkey' -or $output -notmatch 'timed') {
            Write-Host $output
            throw 'PresentMon CLI help does not expose the capture options required by HyperBoost.'
          }
          Write-Host 'PresentMon CLI smoke test OK.'
      - name: Benchmark parser self-test
        shell: pwsh
        run: |
          $ok = Join-Path $env:TEMP 'HyperBoost-benchmark-selftest.ok'
          $fail = Join-Path $env:TEMP 'HyperBoost-benchmark-selftest.fail'
          Remove-Item $ok,$fail -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'publish\HyperBoost.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--benchmark-self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $fail) { Get-Content $fail }
            throw "Benchmark self-test exited with code $($p.ExitCode)."
          }
          if (-not (Test-Path $ok)) {
            throw 'Benchmark self-test did not create its success marker.'
          }
          Get-Content $ok
      - name: Runtime smoke launch
        shell: pwsh
        run: |
          $crash = Join-Path $env:LOCALAPPDATA 'HyperBoost\crash.log'
          if (Test-Path $crash) { Remove-Item $crash -Force }
          $exe = (Resolve-Path 'publish\HyperBoost.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) {
            if (Test-Path $crash) { Get-Content $crash }
            throw "HyperBoost exited during startup smoke test with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Milliseconds 500
          if (Test-Path $crash) {
            $text = Get-Content $crash -Raw
            if (-not [string]::IsNullOrWhiteSpace($text)) {
              Write-Host $text
              throw 'HyperBoost produced crash.log during startup smoke test.'
            }
          }
      - name: Package and checksum
        shell: pwsh
        run: |
          $hyper = (Get-FileHash publish/HyperBoost.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $present = (Get-FileHash publish/PresentMon-2.5.1-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$hyper  HyperBoost.exe"
            "$present  PresentMon-2.5.1-x64.exe"
          ) | Set-Content -Encoding ascii publish/SHA256SUMS.txt
          Compress-Archive -Path publish/HyperBoost.exe,publish/PresentMon-2.5.1-x64.exe,publish/PRESENTMON-LICENSE.txt,publish/SHA256SUMS.txt -DestinationPath HyperBoost-Beta-0.5-win-x64.zip -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HyperBoost-Beta-0.5-win-x64
          path: HyperBoost-Beta-0.5-win-x64.zip
          if-no-files-found: error
