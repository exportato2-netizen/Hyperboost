name: Build Windows beta
on:
  push:
    branches: [ main, codex/beta-0.1, 'review/**', 'beta/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/HyperBoost/HyperBoost.csproj
      - name: Build
        run: dotnet build src/HyperBoost/HyperBoost.csproj -c Release --no-restore
      - name: Publish portable EXE
        run: dotnet publish src/HyperBoost/HyperBoost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --no-restore -o publish
      - name: Package and checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/HyperBoost.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HyperBoost.exe" | Set-Content -Encoding ascii publish/SHA256SUMS.txt
          Compress-Archive -Path publish/HyperBoost.exe,publish/SHA256SUMS.txt -DestinationPath HyperBoost-Beta-0.3-win-x64.zip -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HyperBoost-Beta-0.3-win-x64
          path: HyperBoost-Beta-0.3-win-x64.zip
          if-no-files-found: error
